name: Deploy to GitHub Pages

# Validates the static site and publishes it via the Pages "GitHub Actions" source.
# Triggers are push-to-main and manual dispatch only (no pull_request trigger).
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, worker2]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lightweight, python3-only validation (python3 is present on the runner;
      # tidy/node steps were dropped because the runner has no apt/sudo/node).
      - name: Validate JSON (i18n)
        run: |
          rc=0
          for f in i18n/*.json; do
            if python3 -m json.tool "$f" > /dev/null 2>&1; then echo "ok   $f"
            else echo "::error file=$f::invalid JSON"; rc=1; fi
          done
          exit $rc

      - name: Validate i18n key parity
        run: |
          python3 - <<'PY'
          import json, glob, sys, pathlib
          base = json.load(open('i18n/hu.json', encoding='utf-8'))
          bk = set(base); rc = 0
          for f in sorted(glob.glob('i18n/*.json')):
              d = json.load(open(f, encoding='utf-8'))
              miss, extra = sorted(bk - set(d)), sorted(set(d) - bk)
              empty = sorted(k for k, v in d.items() if not str(v).strip())
              if miss or extra or empty:
                  print(f"::error file={f}::missing={miss} extra={extra} empty={empty}"); rc = 1
              else:
                  print(f"ok   {f} ({len(d)} keys)")
          sys.exit(rc)
          PY

      - name: Assemble _site (public files only — internal folders stay private)
        run: |
          rm -rf _site && mkdir _site
          cp -r index.html about.html contact.html gdpr.html privacy.html assets i18n pages _site/
          : > _site/.nojekyll
          echo "assembled _site:"; ls -1 _site

      - name: Warn on any unfilled placeholders (does not block)
        run: |
          python3 - <<'PY'
          import re, glob, pathlib
          n = 0
          for f in glob.glob('_site/*.html'):
              html = pathlib.Path(f).read_text(encoding='utf-8')
              for ph in sorted(set(re.findall(r'<mark class="ph">([A-Z_0-9]+)</mark>', html))):
                  print(f"::warning file={f}::unfilled placeholder {ph} is published as a visible chip"); n += 1
          print(f"{n} unfilled placeholder(s) — fill them in content/*.md before launch")
          PY

      - name: Configure Pages (set source to GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
